
name: Python Quality Checks

on: [push, pull_request]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checking tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 mypy pytest black

      - name: 1. Check Formatting (Black)
        run: black --line-length 150 --check broken_pipeline.py

      - name: 2. Linting (Flake8)
        run: flake8 --max-line-length=150 broken_pipeline.py

      - name: 3. Type Checking (Mypy)
        run: mypy broken_pipeline.py

      - name: 4. Unit Tests (Pytest)
        run: pytest -v broken_pipeline.py
